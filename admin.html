<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAV Admin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page-shell">
    <div class="page-content">
      <h1>🔐 Admin Panel</h1>

      <div class="header">
        <span id="welcomeUser"></span>
        <div class="btn-group">
          <button onclick="location.href='dashboard.html'">🏠 Dashboard</button>
          <button onclick="logout()">🚪 Logout</button>
        </div>
      </div>

      <!-- API URL Setting -->
      <div class="admin-only card">
        <h3>🌐 API URL</h3>
        <p>Change this when moving from LAN to HTTPS (e.g. <code>https://sub.example.com/api</code>).</p>
        <div class="grid grid-cols-1 md:grid-cols-2">
          <div class="card">
            <h4>🔧 API Base URL</h4>
            <input type="text" id="apiBaseUrlInput" placeholder="http://192.168.1.10:5000/api">
            <button onclick="saveApiBaseUrl()">💾 Save API URL</button>
            <p class="small">Changes take effect after reload.</p>
          </div>
        </div>
      </div>

      <div class="admin-only card">
        <h3>User Management</h3>

        <div class="grid grid-cols-1 md:grid-cols-2">
          <div class="card">
            <h4>👤 Create User</h4>
            <input type="text" id="newUsername" placeholder="Username">
            <input type="password" id="newPassword" placeholder="Password">
            <select id="newRole">
              <option value="standard">Standard</option>
              <option value="admin">Admin</option>
            </select>
            <button onclick="createUser()">💾 Save</button>
          </div>
        </div>

        <div class="card">
          <h4>📋 Users</h4>
          <div id="userList" class="scrollable"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Load config.js first -->
  <script type="module">
    // Read stored API_BASE_URL from localStorage, or use default
    const storedBaseUrl = localStorage.getItem('API_BASE_URL');
    const DEFAULT_API_BASE_URL = 'http://192.168.1.10:5000/api';
    const API_BASE_URL = storedBaseUrl || DEFAULT_API_BASE_URL;

    // Make available to admin.js
    window.API_BASE_URL = API_BASE_URL;

    // Expose a function to save a new URL
    window.saveApiBaseUrlToStorage = function(newUrl) {
      localStorage.setItem('API_BASE_URL', newUrl);
    };
  </script>

  <!-- Then common.js (auth, API helpers, cache) -->
  <script type="module" src="./js/common.js"></script>

  <!-- Then auth.js (logout function) -->
  <script type="module" src="./js/auth.js"></script>

  <!-- Finally page-specific JS -->
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
