<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAV Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
    }
    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
      font-weight: 600;
    }
    h2 {
      font-size: 18px;
      margin: 24px 0 8px;
      font-weight: 600;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 4px;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      margin: 2px 0 8px;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1f2937;
      padding: 16px 16px 20px;
      margin-top: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    input[type="text"],
    input[type="password"],
    select {
      width: 100%;
      box-sizing: border-box;
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 8px 10px;
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.3);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #0b1120;
    }
    .btn-secondary {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #1f2937;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .col-4 {
      flex: 1 1 220px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
    }
    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #1f2937;
      text-align: left;
    }
    th {
      font-weight: 500;
      color: #9ca3af;
    }
    tr:nth-child(even) {
      background: rgba(15,23,42,0.7);
    }
    .pill {
      display: inline-flex;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: #111827;
      color: #9ca3af;
      margin-left: 8px;
    }
    .role-admin {
      color: #f97316;
      font-weight: 500;
    }
    .role-staff {
      color: #22c55e;
      font-weight: 500;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #9ca3af;
    }
    @media (max-width: 640px) {
      .admin-container {
        padding: 16px 12px 32px;
      }
      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .toolbar-right {
        align-self: stretch;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="toolbar">
      <div>
        <h1>Admin Panel</h1>
        <p>Manage staff accounts and roles for the SAV package system.</p>
      </div>
      <div class="toolbar-right">
        <span id="currentUserLabel">Signed in as: —</span>
        <button class="btn btn-secondary" type="button" id="logoutBtn">Logout</button>
      </div>
    </div>

    <h2>Users <span class="pill">Staff &amp; Admins</span></h2>
    <div class="card">
      <div class="row">
        <div class="col-4">
          <label for="newUsername">Username</label>
          <input type="text" id="newUsername" autocomplete="off">
        </div>
        <div class="col-4">
          <label for="newPassword">Password</label>
          <input type="password" id="newPassword" autocomplete="new-password">
        </div>
        <div class="col-4">
          <label for="newRole">Role</label>
          <select id="newRole">
            <option value="staff">Staff</option>
            <option value="admin">Admin</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary" type="button" id="addUserBtn">Add user</button>
      <p class="section-note">
        Admins have full access, including settings and user management. Staff are limited to package operations.
      </p>
    </div>

    <div class="card">
      <h3>Existing users</h3>
      <table>
        <thead>
          <tr>
            <th style="width: 30%;">Username</th>
            <th style="width: 20%;">Role</th>
            <th style="width: 30%;">Created at</th>
            <th style="width: 20%;">Actions</th>
          </tr>
        </thead>
        <tbody id="usersTableBody">
          <!-- populated by admin.js -->
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { checkAuth, logout as commonLogout } from './common.js';
    import './config.js';
    import './auth.js';
    import { initAdminPage } from './admin.js';

    document.addEventListener('DOMContentLoaded', () => {
      const user = checkAuth();
      if (!user) return;

      const label = document.getElementById('currentUserLabel');
      if (label) {
        label.textContent = `Signed in as: ${user.username} (${user.role})`;
      }

      const logoutBtn = document.getElementById('logoutBtn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          commonLogout();
        });
      }

      initAdminPage();
    });
  </script>
</body>
</html>
