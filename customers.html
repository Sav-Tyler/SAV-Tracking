<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SAV Customers</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
    }
    .customers-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px;
      font-weight: 600;
    }
    h2 {
      font-size: 18px;
      margin: 24px 0 8px;
      font-weight: 600;
      border-bottom: 1px solid #1f2937;
      padding-bottom: 4px;
    }
    p {
      font-size: 13px;
      color: #9ca3af;
      margin: 2px 0 8px;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #9ca3af;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      border: 1px solid #1f2937;
      padding: 16px 16px 20px;
      margin-top: 12px;
    }
    label {
      display: block;
      font-size: 13px;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      background: #020617;
      border-radius: 8px;
      border: 1px solid #1f2937;
      padding: 8px 10px;
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 1px rgba(56,189,248,0.3);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      color: #0b1120;
    }
    .btn-secondary {
      background: #111827;
      color: #e5e7eb;
      border: 1px solid #1f2937;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    .col-4 {
      flex: 1 1 220px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
      font-size: 13px;
    }
    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #1f2937;
      text-align: left;
    }
    th {
      font-weight: 500;
      color: #9ca3af;
    }
    tr:nth-child(even) {
      background: rgba(15,23,42,0.7);
    }
    .pill {
      display: inline-flex;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: #111827;
      color: #9ca3af;
      margin-left: 8px;
    }
    @media (max-width: 640px) {
      .customers-container {
        padding: 16px 12px 32px;
      }
      .toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .toolbar-right {
        align-self: stretch;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="customers-container">
    <div class="toolbar">
      <div>
        <h1>Customers</h1>
        <p>Search and manage customer records linked to packages.</p>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-secondary" type="button" onclick="window.location.href='dashboard.html'">
          ← Back to dashboard
        </button>
      </div>
    </div>

    <h2>Search <span class="pill">Name / Phone / Postal</span></h2>
    <div class="card">
      <div class="row">
        <div class="col-4">
          <label for="customerNameSearch">Name</label>
          <input type="text" id="customerNameSearch" placeholder="e.g. Smith">
        </div>
        <div class="col-4">
          <label for="customerPhoneSearch">Phone</label>
          <input type="text" id="customerPhoneSearch" placeholder="e.g. 705-555-1234">
        </div>
        <div class="col-4">
          <label for="customerPostalSearch">Postal code</label>
          <input type="text" id="customerPostalSearch" placeholder="e.g. P5A 1A1">
        </div>
      </div>
      <button class="btn btn-primary" type="button" id="customerSearchBtn">Search customers</button>
      <p class="section-note">
        Search is case-insensitive and matches partial values for name, phone, or postal.
      </p>
    </div>

    <h2>Results</h2>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th style="width: 30%;">Name</th>
            <th style="width: 20%;">Phone</th>
            <th style="width: 20%;">Postal</th>
            <th style="width: 30%;">Street</th>
          </tr>
        </thead>
        <tbody id="customersTableBody">
          <tr>
            <td colspan="4">No customers loaded yet. Perform a search above.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { checkAuth, logout as commonLogout } from './common.js';
    import './config.js';
    import './auth.js';
    import { initCustomersPage } from './customers.js';

    document.addEventListener('DOMContentLoaded', () => {
      const user = checkAuth();
      if (!user) return;

      // Wire up logout button
      document.getElementById('logoutBtn')?.addEventListener('click', () => {
        commonLogout();
      });

      // Wire up navigation
      document.getElementById('adminBtn')?.addEventListener('click', () => {
        window.location.href = 'admin.html';
      });
      document.getElementById('dashboardBtn')?.addEventListener('click', () => {
        window.location.href = 'dashboard.html';
      });
      document.getElementById('settingsBtn')?.addEventListener('click', () => {
        window.location.href = 'settings.html';
      });

      initCustomersPage();
    });
  </script>
</body>
</html>
