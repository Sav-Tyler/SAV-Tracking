<script type="module">
  import { apiGet, logout as commonLogout } from './common.js';

  let pickups = [];
  let packagesByCustomer = {};
  let selectedPickup = null;
  let signatureCanvas, signatureCtx;

  function logout() {
    commonLogout();
  }

  async function fetchPickups() {
    try {
      pickups = await apiGet('/pickups');

      const customerIds = [...new Set(pickups.map(p => p.customer_id).filter(Boolean))];
      packagesByCustomer = {};

      for (const customerId of customerIds) {
        try {
          const pkgs = await apiGet(`/customers/${customerId}/packages?status=signed`);
          packagesByCustomer[customerId] = pkgs;
        } catch (err) {
          console.warn('Could not load packages for customer', customerId, err);
        }
      }

      applyPickupFilter();
    } catch (err) {
      console.error(err);
      const tbody = document.getElementById('pickupTableBody');
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:10px;">Error loading pickup history</td></tr>';
    }
  }

  function applyPickupFilter() {
    const search = document.getElementById('filterSearch').value.trim().toLowerCase();
    const range = document.getElementById('filterRange').value;
    const now = new Date();

    let filtered = pickups.slice();

    if (range !== 'all') {
      const days = parseInt(range, 10);
      const cutoff = new Date();
      cutoff.setDate(now.getDate() - days);
      filtered = filtered.filter(p => {
        const ts = new Date(p.timestamp);
        return ts >= cutoff;
      });
    }

    if (search) {
      filtered = filtered.filter(p => {
        const customerName = (p.customer_name || '').toLowerCase();
        const pickupName = (p.pickup_name || '').toLowerCase();
        const idNumber = (p.pickup_id_number || '').toLowerCase();
        return (
          customerName.includes(search) ||
          pickupName.includes(search) ||
          idNumber.includes(search)
        );
      });
    }

    renderPickupTable(filtered);
  }

  function renderPickupTable(list) {
    const tbody = document.getElementById('pickupTableBody');
    const countEl = document.getElementById('pickupCount');
    countEl.textContent = list.length;

    if (!list.length) {
      tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:10px;">No pickups found for this filter</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    list.forEach(p => {
      const tr = document.createElement('tr');
      tr.style.cursor = 'pointer';
      tr.onclick = () => selectPickup(p);

      const pkgCount = (packagesByCustomer[p.customer_id] || []).length;
      const when = new Date(p.timestamp).toLocaleString();

      tr.innerHTML = `
        <td>
          <div>${p.pickup_name || '(No pickup name)'}</div>
          <div style="font-size:10px; color:rgba(148,163,184,0.95);">ID: ${p.id}</div>
        </td>
        <td>${p.customer_name || '(Unknown customer)'}</td>
        <td>${pkgCount} pkg(s)</td>
        <td>${when}</td>
      `;

      tbody.appendChild(tr);
    });
  }

  function selectPickup(pickup) {
    selectedPickup = pickup;
    document.getElementById('detailCustomerName').value = pickup.customer_name || '';
    document.getElementById('detailPickupName').value = pickup.pickup_name || '';
    document.getElementById('detailIdType').value = pickup.pickup_id_type || '';
    document.getElementById('detailIdNumber').value = pickup.pickup_id_number || '';
    document.getElementById('detailPickupId').textContent = pickup.id;
    document.getElementById('detailPickupTime').textContent = new Date(pickup.timestamp).toLocaleString();

    const summaryEl = document.getElementById('selectedPickupSummary');
    const pkgCount = (packagesByCustomer[pickup.customer_id] || []).length;
    summaryEl.textContent = `${pkgCount} package(s) · Pickup #${pickup.id}`;

    const pkgListEl = document.getElementById('detailPackageList');
    const pkgs = packagesByCustomer[pickup.customer_id] || [];
    if (!pkgs.length) {
      pkgListEl.innerHTML = '<div class="small-text">No signed packages recorded for this customer on file.</div>';
    } else {
      pkgListEl.innerHTML = pkgs.map(pkg => {
        const statusClass = (pkg.status || '').toLowerCase() === 'signed' ? 'signed' : '';
        const created = pkg.created_at ? new Date(pkg.created_at).toLocaleDateString() : '';
        return `
          <div class="package-item">
            <div class="package-item-header">
              <span class="pkg-name">${pkg.courier || ''}</span>
            </div>
            <div>
              <div class="pkg-meta">Tracking: ${pkg.tracking || '(none)'}</div>
              <div class="pkg-meta">Name: ${pkg.name || ''}</div>
            </div>
            <div>
              <div class="pkg-meta">Phone: ${pkg.phone || '(none)'}</div>
              <div class="pkg-meta">Received: ${created}</div>
            </div>
            <div>
              <div class="pkg-status ${statusClass}">${pkg.status || 'pending'}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    loadSignatureImage(pickup.pickup_signature);
  }

  function initCanvas() {
    signatureCanvas = document.getElementById('signatureCanvas');
    signatureCtx = signatureCanvas.getContext('2d');

    function resizeCanvas() {
      const rect = signatureCanvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      signatureCanvas.width = rect.width * ratio;
      signatureCanvas.height = rect.height * ratio;
      signatureCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
      redrawSignature();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  }

  function redrawSignature() {
    if (!signatureCtx || !signatureCanvas) return;
    signatureCtx.fillStyle = '#020617';
    signatureCtx.fillRect(0, 0, signatureCanvas.width, signatureCanvas.height);

    if (!selectedPickup || !selectedPickup.pickup_signature) {
      signatureCtx.fillStyle = 'rgba(148,163,184,0.8)';
      signatureCtx.font = '12px system-ui';
      signatureCtx.fillText('Select a pickup to view signature', 12, 24);
    }
  }

  function loadSignatureImage(signatureData) {
    if (!signatureCtx || !signatureCanvas) return;
    signatureCtx.fillStyle = '#020617';
    signatureCtx.fillRect(0, 0, signatureCanvas.width, signatureCanvas.height);

    if (!signatureData) {
      document.getElementById('signatureStatus').textContent = 'No signature image on record for this pickup.';
      signatureCtx.fillStyle = 'rgba(248,113,113,0.9)';
      signatureCtx.font = '12px system-ui';
      signatureCtx.fillText('No signature image on record', 12, 24);
      return;
    }

    document.getElementById('signatureStatus').textContent = 'Signature captured at time of pickup';

    const img = new Image();
    img.onload = () => {
      const canvasWidth = signatureCanvas.width;
      const canvasHeight = signatureCanvas.height;
      const scale = Math.min(canvasWidth / img.width, canvasHeight / img.height);
      const x = (canvasWidth - img.width * scale) / 2;
      const y = (canvasHeight - img.height * scale) / 2;
      signatureCtx.drawImage(img, x, y, img.width * scale, img.height * scale);
    };
    img.src = signatureData;
  }

  function downloadSignature() {
    if (!selectedPickup || !selectedPickup.pickup_signature) {
      alert('No signature image available to download.');
      return;
    }

    const a = document.createElement('a');
    a.href = selectedPickup.pickup_signature;
    const ts = selectedPickup.timestamp
      ? new Date(selectedPickup.timestamp).toISOString().replace(/[:.]/g, '-')
      : 'unknown';
    a.download = `signature_pickup_${selectedPickup.id}_${ts}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function printSignature() {
    if (!selectedPickup || !selectedPickup.pickup_signature) {
      alert('No signature image available to print.');
      return;
    }

    const printWindow = window.open('', '_blank');
    const ts = selectedPickup.timestamp
      ? new Date(selectedPickup.timestamp).toLocaleString()
      : 'Unknown';
    printWindow.document.write(`
      <html>
        <head>
          <title>Pickup #${selectedPickup.id} - Signature</title>
          <style>
            body { font-family: system-ui, sans-serif; padding: 20px; }
            h1 { font-size: 20px; margin-bottom: 5px; }
            h2 { font-size: 16px; margin-top: 15px; }
            p { margin: 2px 0; }
            img { border: 1px solid #999; margin-top: 10px; max-width: 100%; }
          </style>
        </head>
        <body>
          <h1>Pickup #${selectedPickup.id}</h1>
          <p><strong>Customer:</strong> ${selectedPickup.customer_name || ''}</p>
          <p><strong>Pickup name:</strong> ${selectedPickup.pickup_name || ''}</p>
          <p><strong>ID type:</strong> ${selectedPickup.pickup_id_type || ''}</p>
          <p><strong>ID number:</strong> ${selectedPickup.pickup_id_number || ''}</p>
          <p><strong>Timestamp:</strong> ${ts}</p>

          <h2>Signature</h2>
          <img src="${selectedPickup.pickup_signature}" alt="Signature">

          <h2>Packages</h2>
          <ul>
            ${(packagesByCustomer[selectedPickup.customer_id] || []).map(pkg => `
              <li>${pkg.courier || ''} · Tracking: ${pkg.tracking || '(none)'} · Name: ${pkg.name || ''}</li>
            `).join('')}
          </ul>
        </body>
      </html>
    `);
    printWindow.document.close();
    printWindow.focus();
    printWindow.print();
  }

  window.applyPickupFilter = applyPickupFilter;
  window.downloadSignature = downloadSignature;
  window.printSignature = printSignature;
  window.logout = logout;

  document.addEventListener('DOMContentLoaded', () => {
    const user = JSON.parse(sessionStorage.getItem('savUser') || 'null');
    const userInfoEl = document.getElementById('userInfo');
    if (user && user.username) {
      userInfoEl.textContent = `Signed in as ${user.username} (${user.role || 'staff'})`;
    }

    initCanvas();
    fetchPickups();
  });
</script>
